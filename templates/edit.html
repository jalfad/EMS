<!DOCTYPE html>
<html>
    <head>
        <title>Edit Employee</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
    <div class = "container mt-5">
        <h2>Edit Employee</h2>
        
        <form method="POST" action="" enctype="multipart/form-data">
        <div class="mb-3">
            <input 
                class="form-control"
                type="text"
                name="employee_no"
                value="{{employee.employee_no}}"
                readonly
        
            >
        </div>
        <div class="mb-3">
            <input 
                class="form-control"
                type="text"
                name="first_name"
                value="{{employee.first_name}}"
                required
            >
        </div>
       
        <div class="mb-3">
            <input
                class="form-control"
                type="text"
                name="last_name"
                value="{{employee.last_name}}"
                required
            >
        </div>
        <div class="mb-3">
            <input 
                class="form-control" 
                type="text" 
                name="email"
                value="{{employee.email}}"
                required
            >
        </div>
        <div class="mb-3">
            <select name="department" class="form-control">
                <option 
                    value="IT"
                    {% if employee.department == 'IT' %}
                    selected
                    {% endif %}
                >
                    IT
                </option>
            
           
                <option 
                    value="HR"
                    {% if employee.department == 'HR' %}
                    selected
                    {% endif %}
                >

                HR

                </option>
            
                <option 
                    value="Accounting"
                    {% if employee.department == 'Accounting' %}
                    selected
                    {% endif %}>
                    Accounting

                </option>
            
                <option 
                    value="Finance"
                    {% if employee.department == 'Finance' %}
                    selected
                    {% endif %}>
                    Finance

                </option>
            </select>

        </div>
        <div class="mb-3">
            <input 
            class="form-control"
            type="text"
            name="position"
            value="{{ employee.position}}"
            required>

        </div>
        <div class="mb-3">
           <select name="status" class="form-control">
            <option 
                value="Active"
                {% if employee.status == 'Active' %}
                selected
                {% endif %}
            >
                Active
            </option>
            <option
                value="Inactive"
                {% if employee.status == 'Inactive' %}
                selected
                {% endif %}>
                Inactive
            </option>
           </select>
        </div>
        <div class="mb-3">
            <label class="form-label"> Change Photo </label>

        </div>
        <div class="mb-3">
         {% if employee.photo %}
        <img id="photo-preview" src="{{ url_for('static', filename='uploads/' + employee.photo)}}" width="100" height="100" style="object-fit: cover;border-radius: 50%;">
         {{ employee.photo }}
        {% endif %}
        </div>
        <div class="mb-3">
            <input type="file" name="photo" class="form-control" id="photo-input">
        </div>
            
            <button class="btn btn-success" type="submit"> Save </button>
            <button class="btn btn-secondary" type="submit"> Back </button>
        </form>
        <!--<br>
        <a href="/">Back</a> -->
    </div>
    <script>
        document.getElementById('photo-input').addEventListener(
            'change',
            function(event){
                const file = event.target.files[0];

                if(file){
                    const reader = new FileReader();
                    reader.onload = function(e){
                        document.getElementById('photo-preview').src = e.target.result;
                    };
                    reader.readAsDataURL(file)
                }
            }
        );
    </script>
    </body>
</html>
