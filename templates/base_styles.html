<!-- Shared CSS injected via Jinja include -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg:          #0d0f14;
    --surface:     #141720;
    --surface2:    #191d28;
    --border:      #1e2230;
    --border2:     #252a38;
    --accent:      #6c63ff;
    --accent-lt:   #8b85ff;
    --accent-dim:  rgba(108,99,255,.15);
    --text:        #e8eaf0;
    --text2:       #9ca3af;
    --muted:       #6b7280;
    --danger:      #ef4444;
    --danger-dim:  rgba(239,68,68,.15);
    --success:     #22c55e;
    --success-dim: rgba(34,197,94,.15);
    --warning:     #f59e0b;
    --warning-dim: rgba(245,158,11,.15);
    --info:        #38bdf8;
    --info-dim:    rgba(56,189,248,.15);
    --sidebar-w:   240px;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
}

/* ── Sidebar ── */
.sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
    z-index: 100;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px 28px;
    border-bottom: 1px solid var(--border);
}
.sidebar-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent-lt));
    border-radius: 10px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(108,99,255,.35);
}
.sidebar-logo svg { width: 20px; height: 20px; fill: #fff; }
.sidebar-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.3px;
}
.sidebar-sub {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 2px;
}

.sidebar-nav {
    flex: 1;
    padding: 20px 12px 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    color: var(--text2);
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    transition: background .15s, color .15s;
}
.sidebar-nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-nav a:hover { background: var(--accent-dim); color: var(--text); }
.sidebar-nav a.active { background: var(--accent-dim); color: var(--accent-lt); }

.sidebar-footer {
    padding: 16px 12px 0;
    border-top: 1px solid var(--border);
}
.user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
}
.user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-lt));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 0.825rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 0.7rem; color: var(--muted); }
.logout-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    transition: background .15s, color .15s;
    flex-shrink: 0;
}
.logout-btn:hover { background: var(--danger-dim); color: var(--danger); }
.logout-btn svg { width: 16px; height: 16px; }

/* ── Main ── */
.main {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
}
.topbar-title h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.3px;
}
.topbar-title p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

.content { padding: 28px 32px; }

/* ── Stats ── */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}
.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color .2s;
}
.stat-card:hover { border-color: var(--border2); }
.stat-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.stat-icon svg { width: 22px; height: 22px; }
.stat-icon.purple { background: var(--accent-dim); color: var(--accent-lt); }
.stat-icon.green  { background: var(--success-dim); color: var(--success); }
.stat-icon.red    { background: var(--danger-dim); color: var(--danger); }
.stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.stat-value { font-size: 2rem; font-weight: 700; letter-spacing: -1px; line-height: 1; }

/* ── Card ── */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
}
.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
}
.card-header h3 {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: -0.2px;
}
.card-body { padding: 24px; }

/* ── Form ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
}
.field input, .field select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    appearance: none;
}
.field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.15);
}
.field input::placeholder { color: var(--muted); }
.field input[readonly] { color: var(--muted); cursor: not-allowed; }

/* file input */
.field input[type="file"] { padding: 8px 14px; cursor: pointer; }
.field input[type="file"]::-webkit-file-upload-button {
    background: var(--accent-dim);
    color: var(--accent-lt);
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    margin-right: 10px;
}

.form-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ── Buttons ── */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 9px;
    font-family: 'Inter', sans-serif;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    border: none;
    transition: opacity .15s, transform .1s, box-shadow .15s;
    white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn-accent    { background: linear-gradient(135deg, var(--accent), var(--accent-lt)); color: #fff; box-shadow: 0 2px 12px rgba(108,99,255,.3); }
.btn-accent:hover { opacity: .9; }
.btn-ghost     { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }
.btn-success   { background: var(--success-dim); color: var(--success); border: 1px solid rgba(34,197,94,.25); }
.btn-success:hover { background: rgba(34,197,94,.25); }
.btn-danger-ghost { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
.btn-danger-ghost:hover { background: rgba(239,68,68,.25); }
.btn-info      { background: var(--info-dim); color: var(--info); border: 1px solid rgba(56,189,248,.25); }
.btn-info:hover { background: rgba(56,189,248,.25); }
.btn-warning   { background: var(--warning-dim); color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
.btn-warning:hover { background: rgba(245,158,11,.25); }
.btn-sm { padding: 5px 12px; font-size: 0.78rem; border-radius: 7px; }

/* ── Toolbar ── */
.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
}
.search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
}
.search-wrap svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--muted);
    pointer-events: none;
}
.search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 14px 9px 38px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color .2s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--muted); }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead tr { border-bottom: 1px solid var(--border); }
thead th {
    padding: 12px 16px;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
}
tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .12s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
td {
    padding: 12px 16px;
    font-size: 0.875rem;
    color: var(--text2);
    vertical-align: middle;
}
td.text-main { color: var(--text); font-weight: 500; }
td.center { text-align: center; }

/* ── Avatar ── */
.emp-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border2);
}
.emp-avatar-placeholder {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-lt));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #fff;
    border: 2px solid var(--border2);
    flex-shrink: 0;
}

/* ── Badges ── */
.badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
}
.badge-success { background: var(--success-dim); color: var(--success); }
.badge-danger  { background: var(--danger-dim); color: var(--danger); }
.badge-primary { background: var(--accent-dim); color: var(--accent-lt); }
.badge-warning { background: var(--warning-dim); color: var(--warning); }
.badge-secondary { background: rgba(156,163,175,.12); color: var(--text2); }

/* ── Flash messages ── */
.flash-bar {
    padding: 12px 32px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
}
.flash-bar.danger  { background: var(--danger-dim); color: #fca5a5; border-bottom: 1px solid rgba(239,68,68,.2); }
.flash-bar.success { background: var(--success-dim); color: #86efac; border-bottom: 1px solid rgba(34,197,94,.2); }
.flash-bar svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ── Pagination ── */
.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 16px;
    border-top: 1px solid var(--border);
}
.page-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text2);
    text-decoration: none;
    border: 1px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
}
.page-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
.page-btn.active { background: var(--accent-dim); color: var(--accent-lt); border-color: rgba(108,99,255,.3); }
.page-btn.disabled { opacity: .35; pointer-events: none; }

/* section divider */
.section-divider { height: 1px; background: var(--border); margin: 8px 0; }

/* ── Mobile menu toggle + overlay (hidden on desktop) ── */
.menu-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: 9px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    margin-right: 12px;
}
.menu-toggle svg { width: 20px; height: 20px; }
.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 99;
    opacity: 0;
    transition: opacity .2s;
}
.sidebar-overlay.open { display: block; opacity: 1; }

/* ── Responsive breakpoints ── */
@media (max-width: 900px) {
    .sidebar {
        transform: translateX(-100%);
        transition: transform .25s ease;
        box-shadow: 0 0 40px rgba(0,0,0,.5);
    }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle { display: inline-flex; }
    .topbar { padding: 16px 18px; }
    .topbar-title h2 { font-size: 1rem; }
    .content { padding: 18px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid, .form-grid.cols-3 { grid-template-columns: 1fr; }
    .card-body { padding: 16px; }
    .card-header { padding: 14px 16px; }
    .toolbar { padding: 12px 16px; }
    .search-wrap { max-width: none; }
    .pagination { flex-wrap: wrap; }
    .detail-grid { grid-template-columns: 1fr !important; }
    .detail-item { border-right: none !important; }
    .detail-item:nth-last-child(-n+2) { border-bottom: 1px solid var(--border) !important; }
    .detail-item:last-child { border-bottom: none !important; }
    .profile-hero { flex-wrap: wrap !important; padding: 20px !important; }
}

@media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr; }
    .form-footer, .toolbar form { flex-wrap: wrap; }
    .btn { font-size: 0.8rem; padding: 8px 14px; }
    .topbar { padding: 14px; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var sidebar = document.querySelector('.sidebar');
    var topbar = document.querySelector('.topbar');
    if (!sidebar || !topbar) return; // e.g. login page has neither

    var overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);

    var toggle = document.createElement('button');
    toggle.className = 'menu-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-label', 'Toggle menu');
    toggle.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>';
    topbar.insertBefore(toggle, topbar.firstChild);

    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

    toggle.addEventListener('click', function () {
        sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);
    sidebar.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', closeSidebar);
    });
});
</script>
